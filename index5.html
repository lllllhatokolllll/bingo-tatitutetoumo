<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ときなん盆踊りフェス ビンゴ</title>
    <style>
        :root {
            --primary-color: #ff4757;
            --accent-color: #ffa502;
            --bg-color: #071126;
            --text-color: #ffffff;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .instruction {
            width: 100%;
            max-width: 400px;
            font-size: 12px;
            font-weight: bold;
            background-color: rgba(7, 17, 38, 0.85);
            padding: 8px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255,165,2,0.4);
            line-height: 1.4;
            margin-bottom: 15px;
            box-sizing: border-box;
            color: #fff;
        }

        .bingo-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .bg-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 20px;
        }

        .bingo-board {
            position: absolute;
            top: 36.5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 71.5%; 
            height: 56.5%; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            box-sizing: border-box;
            padding: 4px;
            z-index: 5;
        }

        .cell {
            background-color: rgba(255, 255, 255, 0.95); 
            border: 1.5px solid #bdc3c7;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.1);
        }

        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 8px;
            color: #444;
            font-weight: normal;
            letter-spacing: 0;
            padding-bottom: 1px;
        }
        .cell-text {
            font-size: 11px;
            font-weight: bold;
            line-height: 1.35;
            color: #1a252f; 
            word-break: break-all;
            z-index: 1;
            transition: opacity 0.2s;
        }
        .cell.selected .cell-text {
            opacity: 0.3; /* スタンプが押されたら文字を薄くして見やすく */
        }
